<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jadon's Excuses</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="status-dot" aria-hidden="true"></span>
        <div>
          <div class="title">Jadon's Excuses</div>
          <div class="subtitle">Tab bridge</div>
        </div>
      </div>
      <p id="connection-status" class="connection-status" role="status"></p>
    </header>
    <main>
      <section>
        <h2>Today's top domains</h2>
        <div id="domains"></div>
      </section>
      <section>
        <label class="row">
          <input type="checkbox" id="pause" />
          <span>Pause tracking</span>
        </label>
      </section>
    </main>
    <footer>
      <button id="open-app" type="button" class="btn-primary">
        Open Jadon's Excuses
      </button>

      <div id="download-cta" class="download-cta">
        <div class="download-cta-icon">JE</div>
        <p class="download-cta-heading">Get the desktop app</p>
        <p class="download-cta-sub">
          Jadon's Excuses tracks your focus, not just your tabs. The desktop app
          is required.
        </p>
        <a
          class="btn-download"
          href="https://github.com/NoahManning03/jadons-excuses/releases/download/v1.0.0/JadonsExcuses-v1.0.dmg"
          target="_blank"
          rel="noopener noreferrer"
          >⬇ Download for macOS — Free</a>
        <p class="download-meta">macOS · 3.8 MB · Notarized by Apple</p>
      </div>

      <p class="hint">
        Connects to <code>ws://127.0.0.1:9876</code> while the desktop app is
        running.
      </p>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
